<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save the Date — Raúl & Valeria</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ddd8d0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      gap: 24px;
      font-family: 'Montserrat', sans-serif;
    }

    #card {
      width: 560px;
      background: #1c1510;
      padding: 64px 52px 56px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    /* thin gold frame inside */
    #card::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(201,160,96,0.35);
      pointer-events: none;
    }

    .nos-casamos {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: #c9a060;
      margin-bottom: 32px;
    }

    .names {
      font-family: 'Great Vibes', cursive;
      font-size: 86px;
      line-height: 1.05;
      color: #f5f0e8;
    }

    .amp {
      display: block;
      font-size: 52px;
      color: #c9a060;
      line-height: 1;
      margin: 4px 0;
    }

    .rule {
      width: 48px;
      height: 1px;
      background: #c9a060;
      margin: 32px auto;
      opacity: 0.6;
    }

    .date-big {
      font-family: 'Playfair Display', serif;
      font-size: 52px;
      font-weight: 700;
      color: #f5f0e8;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .date-month {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-style: italic;
      color: #c9a060;
      letter-spacing: 3px;
      margin-top: 6px;
    }

    .date-year {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(245,240,232,0.4);
      text-transform: uppercase;
      margin-top: 8px;
    }

    .rule2 {
      width: 48px;
      height: 1px;
      background: #c9a060;
      margin: 32px auto;
      opacity: 0.6;
    }

    .save-msg {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(245,240,232,0.5);
      line-height: 2;
    }

    .save-msg strong {
      color: #c9a060;
      font-weight: 500;
    }

    /* ── DOWNLOAD BUTTON ── */
    .dl-btn {
      padding: 13px 40px;
      background: #1c1510;
      color: #c9a060;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      border: 1px solid #c9a060;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .dl-btn:hover {
      background: #c9a060;
      color: #1c1510;
    }

    @media (max-width: 600px) {
      #card { width: 100%; padding: 48px 28px 40px; }
      .names { font-size: 64px; }
      .date-big { font-size: 40px; }
    }
  </style>
</head>
<body>

  <div id="card">
    <p class="nos-casamos">¡Nos Casamos!</p>

    <div class="names">
      Raúl
      <span class="amp">&amp;</span>
      Valeria
    </div>

    <div class="rule"></div>

    <p class="date-big">06</p>
    <p class="date-month">Marzo</p>
    <p class="date-year">2027</p>

    <div class="rule2"></div>

    <p class="save-msg">
      <strong>Guarda la fecha</strong><br/>
      Casona los Paltos · Paine<br/>
      19:00 hrs
    </p>
  </div>

  <button class="dl-btn" onclick="downloadPNG()">↓ &nbsp; Descargar PNG</button>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    function downloadPNG() {
      const btn = document.querySelector('.dl-btn');
      btn.textContent = 'Generando...';
      html2canvas(document.getElementById('card'), {
        scale: 3,
        backgroundColor: '#1c1510',
        useCORS: true,
        logging: false
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'save-the-date-raul-valeria.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.textContent = '↓   Descargar PNG';
      });
    }
  </script>

</body>
</html>
