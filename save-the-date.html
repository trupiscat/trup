<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save the Date — Raúl & Valeria</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Great+Vibes&family=Lora:ital@1&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #e0d5cc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      gap: 24px;
      font-family: 'Caveat', cursive;
    }

    #card {
      width: 460px;
      background: #fdf8f5;
      padding: 36px 40px 44px;
      text-align: center;
      position: relative;
      box-shadow: 0 12px 48px rgba(0,0,0,0.13);
    }

    /* Sketchy border */
    #card::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1.5px dashed rgba(0,0,0,0.18);
      pointer-events: none;
    }

    /* ── SAVE THE DATE curved ── */
    .svg-title {
      display: block;
      width: 100%;
      max-width: 360px;
      margin: 0 auto 20px;
    }

    /* ── CAT ── */
    .cat-wrap {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* floating hearts */
    .heart {
      position: absolute;
      font-size: 18px;
      opacity: 0.22;
      color: #e87ca0;
      animation: floatHeart 3s ease-in-out infinite;
      user-select: none;
      pointer-events: none;
    }

    .heart:nth-child(1)  { top: 4px;   left: 18px;  font-size: 14px; animation-delay: 0s;    animation-duration: 3.2s; }
    .heart:nth-child(2)  { top: 20px;  left: 52px;  font-size: 22px; animation-delay: 0.4s;  animation-duration: 2.8s; }
    .heart:nth-child(3)  { top: 2px;   right: 22px; font-size: 16px; animation-delay: 0.8s;  animation-duration: 3.5s; }
    .heart:nth-child(4)  { top: 28px;  right: 50px; font-size: 20px; animation-delay: 0.2s;  animation-duration: 2.9s; }
    .heart:nth-child(5)  { top: 50%;   left: 2px;   font-size: 13px; animation-delay: 1.0s;  animation-duration: 3.1s; transform: translateY(-50%); }
    .heart:nth-child(6)  { top: 50%;   right: 2px;  font-size: 15px; animation-delay: 0.6s;  animation-duration: 3.4s; transform: translateY(-50%); }
    .heart:nth-child(7)  { bottom: 22px; left: 24px;  font-size: 20px; animation-delay: 1.2s;  animation-duration: 2.7s; }
    .heart:nth-child(8)  { bottom: 6px;  left: 58px;  font-size: 13px; animation-delay: 0.3s;  animation-duration: 3.3s; }
    .heart:nth-child(9)  { bottom: 20px; right: 26px; font-size: 18px; animation-delay: 0.9s;  animation-duration: 3.0s; }
    .heart:nth-child(10) { bottom: 4px;  right: 60px; font-size: 11px; animation-delay: 1.5s;  animation-duration: 2.6s; }

    @keyframes floatHeart {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.22; }
      50%       { transform: translateY(-6px) scale(1.1); opacity: 0.35; }
    }

    .cat-circle {
      width: 210px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      flex-shrink: 0;
    }

    .cat-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── CORNER DECO ── */
    .corner-deco {
      position: absolute;
      font-size: 16px;
      opacity: 0.35;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
    .corner-deco.tl { top: 18px;  left: 18px; }
    .corner-deco.tr { top: 18px;  right: 18px; }
    .corner-deco.bl { bottom: 18px; left: 18px; }
    .corner-deco.br { bottom: 18px; right: 18px; }

    /* ── RIBBON ── */
    .ribbon-outer {
      position: relative;
      margin: 22px -8px 4px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ribbon-body {
      position: absolute;
      inset: 0;
      background: #eddfc8;
    }

    /* left fold */
    .ribbon-body::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 22px;
      background: #d4c4a8;
      clip-path: polygon(0 0, 100% 8%, 100% 92%, 0 100%, 22% 50%);
    }

    /* right fold */
    .ribbon-body::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 22px;
      background: #d4c4a8;
      clip-path: polygon(0 8%, 100% 0, 78% 50%, 100% 100%, 0 92%);
    }

    .ribbon-text {
      position: relative;
      z-index: 1;
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 20px;
      color: #5a3e28;
    }

    /* ── NAMES ── */
    .names {
      font-family: 'Great Vibes', cursive;
      font-size: 52px;
      color: #b05520;
      line-height: 1.05;
      margin-top: 24px;
    }

    /* ── DIVIDER ── */
    .mini-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px auto 6px;
      color: #e87ca0;
      opacity: 0.5;
      font-size: 12px;
      letter-spacing: 6px;
    }

    .mini-divider::before,
    .mini-divider::after {
      content: '';
      width: 48px;
      height: 1px;
      background: linear-gradient(to right, transparent, #c9a8a0);
    }

    /* ── DATE ── */
    .date {
      font-family: 'Caveat', cursive;
      font-size: 30px;
      font-weight: 700;
      color: #2a2a2a;
      letter-spacing: 5px;
      margin-top: 0;
    }

    /* ── PLACE ── */
    .place {
      font-family: 'Caveat', cursive;
      font-size: 16px;
      color: #aaa;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* ── TIME ── */
    .time-place {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
    }

    .time-badge {
      font-family: 'Caveat', cursive;
      font-size: 14px;
      color: #b05520;
      background: rgba(176,85,32,0.08);
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* ── DOWNLOAD ── */
    .dl-btn {
      padding: 12px 40px;
      background: #2a2a2a;
      color: white;
      font-family: 'Caveat', cursive;
      font-size: 18px;
      letter-spacing: 2px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .dl-btn:hover { background: #b05520; }

    @media (max-width: 500px) {
      #card { width: 100%; padding: 28px 20px 36px; }
      .names { font-size: 58px; }
    }
  </style>
</head>
<body>

  <div id="card">

    <!-- Corner decorations -->
    <span class="corner-deco tl">✿</span>
    <span class="corner-deco tr">✿</span>
    <span class="corner-deco bl">✿</span>
    <span class="corner-deco br">✿</span>

    <!-- SAVE THE DATE en arco — igual que el ejemplo -->
    <svg class="svg-title" viewBox="0 0 360 90" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="arc" d="M 20 80 Q 180 10 340 80" />
      </defs>
      <!-- shadow layer -->
      <text
        font-family="Caveat, cursive"
        font-size="34"
        font-weight="700"
        fill="rgba(120,60,20,0.12)"
        letter-spacing="3"
        dy="2"
      >
        <textPath href="#arc" startOffset="50%" text-anchor="middle">❧ Save the Date ❧</textPath>
      </text>
      <!-- main text -->
      <text
        font-family="Caveat, cursive"
        font-size="34"
        font-weight="700"
        fill="#b05520"
        letter-spacing="3"
      >
        <textPath href="#arc" startOffset="50%" text-anchor="middle">❧ Save the Date ❧</textPath>
      </text>
    </svg>

    <!-- FOTO DEL GATO -->
    <!-- Guarda la foto del gato como "gato.jpg" en la misma carpeta que este HTML -->
    <div class="cat-wrap">
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <div class="cat-circle">
        <img
          src="gato.png"
          alt="Nuestro gato"
          onerror="this.style.display='none'; this.parentElement.innerHTML='🐱';"
        />
      </div>
    </div>

    <!-- RIBBON -->
    <div class="ribbon-outer">
      <div class="ribbon-body"></div>
      <span class="ribbon-text">¡Mis papás se casan!</span>
    </div>

    <!-- NAMES -->
    <p class="names">Raúl &amp; Valeria</p>

    <!-- DIVIDER -->
    <div class="mini-divider">♥</div>

    <!-- DATE -->
    <p class="date">06 · 03 · 2027</p>

    <!-- PLACE -->
    <p class="place">Casona los Paltos · Paine</p>

  </div>

  <button class="dl-btn" onclick="downloadPNG()">↓ Descargar PNG</button>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    async function downloadPNG() {
      const btn = document.querySelector('.dl-btn');
      btn.textContent = 'Generando...';
      try {
        await document.fonts.ready;
        const canvas = await html2canvas(document.getElementById('card'), {
          scale: 3,
          useCORS: true,
          allowTaint: true,
          logging: false,
          imageTimeout: 10000
        });
        const link = document.createElement('a');
        link.download = 'save-the-date-raul-valeria.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        alert('No se pudo generar la imagen. Intenta hacer una captura de pantalla de la tarjeta.');
        console.error(err);
      } finally {
        btn.textContent = '↓ Descargar PNG';
      }
    }
  </script>

</body>
</html>
